[workspace]

[package]
name = "pagni-health-exams-aggregator"
version = "2.0.0-alpha.0"
description = "Privacy-first aggregator of PAGNI blood-test PDF reports"
authors = ["gtopsis"]
license = "MIT"
edition = "2021"

[lib]
name = "pagni_health_exams_aggregator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
pdf-extract = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ulid = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
